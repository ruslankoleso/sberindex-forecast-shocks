# Фундаментальные модели временных рядов (zero-shot, без дообучения)
chronos_bolt:
  model_id: amazon/chronos-bolt-small   # ~48 млн параметров, работает на CPU/MPS
  device: cpu
  batch_size: 256
  quantiles: [0.1, 0.5, 0.9]
chronos2:
  model_id: amazon/chronos-2
  device: cpu
  batch_size: 256
  quantiles: [0.1, 0.5, 0.9]
timesfm:
  # веса скачаны в models/ (через curl: загрузчик Hugging Face на этой машине зависал)
  model_id: models/timesfm-2.5-200m-pytorch   # оригинал: google/timesfm-2.5-200m-pytorch
  max_context: 128      # наши ряды 12–72 точки; 1024 по умолчанию — лишняя работа
  max_horizon: 128
  batch_size: 32         # по умолчанию 1 ряд за раз — очень медленно; 32 — рекомендация навыка TimesFM для CPU 16 ГБ
tirex:
  model_id: models/TiRex/model.ckpt   # оригинал: NX-AI/TiRex
  device: cpu
chronos2_ft:                 # дообучение Chronos-2 перед каждой точкой прогноза
  mode: full
  num_steps: 300
  batch_size: 64
  learning_rate: 1.0e-5
  prediction_length: 12
  seed: 42
  output_dir: data/interim/chronos2_ft
timesfm_lora:                # дообучение TimesFM через LoRA (по примеру навыка timesfm-forecasting)
  model_dir: models/timesfm-2.5-200m-transformers   # оригинал: google/timesfm-2.5-200m-transformers
  context_len: 32            # кратно 32; ряд МО с удлинённой историей — 61–72 мес.
  horizon_len: 12
  predict_context_len: 64     # контекст при прогнозе (кратно 32)
  num_samples: 8000
  num_steps: 150
  batch_size: 64
  lr: 1.0e-4
  lora_r: 8
  lora_alpha: 16
  seed: 42
