# Бенчмарк детекторов на искусственных шоках
seed: 42
n_series: 400              # сколько реальных рядов МО берём для встраивания шоков
warmup: 8                  # первые месяцы детектор только наблюдает
tau_range: [12, 20]        # месяц перелома (индекс от 0 = 2023-01)
tolerance: 3               # шок считается найденным, если тревога в [τ, τ+3]
target_false_alarm: 0.10   # порог каждого детектора — так, чтобы 10 % «спокойных» рядов дали ложную тревогу
scenarios:                 # величины в долях (0.10 = 10 %)
  level_up_10:   {type: level, size: 0.10}
  level_down_10: {type: level, size: -0.10}
  level_up_20:   {type: level, size: 0.20}
  level_down_20: {type: level, size: -0.20}
  trend_up:      {type: trend, size: 0.02}
  trend_down:    {type: trend, size: -0.02}
  spike_up:      {type: spike, size: 0.25}    # разовый выброс — НЕ структурный сдвиг
  spike_down:    {type: spike, size: -0.25}
# Реальные события для проверки на национальном ряде (месяц, когда шок отразился в тратах)
national_events:
  covid_2020: "2020-04-01"      # нерабочие дни и локдаун с 30.03.2020
  shock_2022: "2022-03-01"      # санкции и шок потребительского рынка (конец февраля – март 2022)
