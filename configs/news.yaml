# Сбор и обработка новостей
source: lenta.ru                  # открытый архив заголовков по дням и рубрикам (robots.txt не запрещает)
rubrics: [russia, economics]      # «Россия» (регионы, происшествия) и «Экономика»
start: "2022-12-01"               # с запасом на месяц до начала данных СберИндекса
end: "2024-12-31"
delay_sec: 1.0                    # пауза между запросами (вежливый сбор)
max_pages_per_day: 15
n_parts: 4                        # период делится на части, по потоку на рубрику × часть
raw_dir: data/external/news/raw   # кэш страниц (по одному json на рубрику-день)
headlines_file: data/external/news/headlines.parquet
use_sources: [regnum, mchs]       # дополнительные источники к Lenta.ru (если собраны)

# Темы новостей: основы слов (регулярные выражения, без учёта регистра).
# Подобраны под события, которые могут менять потребительские траты в МО.
# Каждая основа ищется с начала слова (граница слова), чтобы «непростой» не давал «простой».
topics:
  emergency:      ["наводнен", "паводк", "подтоплен", "прорыв дамб", "пожар", "возгоран", "взрыв", "обрушен", "землетрясен", "смерч", "снегопад", "режим чс", "режим чрезвычайн", "эвакуац", "отключени[ея] (свет|электр|тепл|воды|газ)", "авари"]
  attack:         ["беспилотник", "бпла", "дрон", "ракетн", "обстрел", "атак[аиу]", "сбит"]
  industry_neg:   ["закры[тл][а-яё]* (завод|предприят|комбинат|фабрик|шахт|рудник)", "банкрот", "сокращени[ея] (штат|сотрудник|работник)", "увольнени", "задержк[а-яё]* (зарплат|выплат)", "простой (завод|предприят|производств)", "останов[а-яё]* (производств|завод|предприят)"]
  industry_pos:   ["открыт[а-яё]* (завод|предприят|производств|фабрик)", "запуст[а-яё]* (завод|производств)", "инвестиц", "новое производств", "строительств[а-яё]* (завод|комбинат)"]
  prices:         ["подорожа", "рост цен", "цены выросл", "инфляц", "дефицит"]
  social_pay:     ["выплат", "компенсац", "пособи", "материальн[а-яё]* помощ"]
  key_rate:       ["ключев[а-яё]* ставк"]
monthly_file: data/external/news/news_monthly.parquet

# Анализ событий и карточки шоков (правила зафиксированы до расчёта)
events:
  topics: [emergency, industry_neg, industry_pos, social_pay]   # «значимые» темы
  mo_min_news: 2          # событие МО: ≥2 значимых новостей с названием МО за месяц
  region_min_news: 3      # событие региона: ≥3 значимых новостей о регионе за месяц ...
  region_ratio: 3.0       # ... и ≥3× медианы этого региона по всем месяцам (всплеск)
  window: [-3, 3]         # окно анализа события: месяцы относительно месяца события
  n_permutations: 2000    # перестановочный тест (случайные МО-месяцы того же размера)
  seed: 42
cards:
  min_shift_pct: 5        # карточки для шоков лучшего детектора со сдвигом ≥5 %
  lookback_months: 2      # новости за 2 мес. до начала сдвига …
  lookahead_months: 1     # … и до 1 мес. после тревоги
  max_headlines: 5

# Уточнение после первого анализа: «крупные события» — узкий словарь экономически значимых ЧС
# и закрытий (рядовые пожары и аварии исключены). Введено ПОСЛЕ того, как широкое определение
# дало нулевой результат, — в отчёте помечено как уточнение, а не заранее заданное правило.
major_events:
  method: nlp+llm         # keywords — только словарь (вторая попытка); nlp+llm — (словарь или rubert) и подтверждение Qwen; правило зафиксировано до расчёта
  pattern: "(?:^|[^а-яё])(паводк|наводнен|подтоплен|прорыв[а-яё]* дамб|режим[а-яё]* (чс|чрезвычайн)|эвакуац|землетрясен|закры[тл][а-яё]* (завод|предприят|комбинат|фабрик|шахт|рудник)|банкрот[а-яё]* (завод|предприят|комбинат)|массов[а-яё]* (сокращен|увольнен))"
  min_news: 2             # событие: регион-месяц с ≥2 такими новостями
  pre: [-2, -1]           # «до»
  post: [0, 1, 2]         # «после»

# Дополнительные источники (robots.txt разрешает эти разделы)
sources:
  regnum:                       # ИА REGNUM — региональное агентство; заголовки и даты из карты сайта по месяцам
    sitemap: "https://regnum.ru/sitemap/news/{ym}.xml"
    raw_dir: data/external/news/raw_regnum
  mchs:                         # МЧС России — официальные новости (лента с постраничным архивом, ?page= разрешён)
    list_url: "https://mchs.gov.ru/deyatelnost/press-centr/novosti?page={page}"
    raw_dir: data/external/news/raw_mchs
    max_pages: 900
  ria: skipped                  # дневной архив отдаёт только 20 новостей, подгрузка — через запрещённый robots.txt раздел /services/

# Нейросетевая разметка «крупных событий» (слабое обучение на разметке ключевыми словами)
nlp:
  model_dir: models/rubert-tiny2      # оригинал: cointegrated/rubert-tiny2 (эмбеддинги предложений, 29 млн параметров)
  batch_size: 256
  max_length: 64
  neg_per_pos: 20                     # отрицательных примеров на один положительный
  threshold: 0.5                      # вероятность «крупного события»
  seed: 42
  emb_cache: data/interim/news_embeddings.npy

# Проверка кандидатов языковой моделью (второй этап после rubert-tiny2)
llm:
  model_dir: models/Qwen3-1.7B        # оригинал: Qwen/Qwen3-1.7B
  candidate_p: 0.3                    # кандидаты: вероятность «крупного события» по rubert ≥ 0.3 или слово из словаря …
  require_place: true                 # … и в заголовке найдено место (МО или регион)
  batch_size: 8
  device: mps                         # Apple Silicon; cpu — если mps недоступен
